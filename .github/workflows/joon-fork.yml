name: Joon fork validation
on:
  pull_request:
    branches: [joon/stable]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: joon-fork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'joon-ai/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [avatar, typecheck, build]
    env:
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Use pinned package manager
        run: npm install --global pnpm@9.15.4
      - name: Resolve the release lockfile and install
        run: |
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Focused avatar tests and UI tokens
        if: matrix.lane == 'avatar'
        run: |
          pnpm check:token-gates
          pnpm exec vitest run packages/shared/src/agent-appearance.test.ts packages/shared/src/validators/access.test.ts server/src/__tests__/agent-avatars.test.ts server/src/__tests__/agent-persona-persistence.test.ts ui/src/components/AgentPersona.test.tsx ui/src/components/timeline/WorkTimelineChart.test.tsx ui/src/pages/AgentDetail.avatar.test.tsx
      - name: Workspace typecheck
        if: matrix.lane == 'typecheck'
        run: pnpm -r typecheck
      - name: Build the workspace
        if: matrix.lane == 'build'
        run: pnpm build

  regression_shards:
    if: github.repository == 'joon-ai/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - label: server-1
            mode: general
            group: general-server-without-chat
            shard_index: 0
            shard_count: 12
          - label: server-2
            mode: general
            group: general-server-without-chat
            shard_index: 1
            shard_count: 12
          - label: server-3
            mode: general
            group: general-server-without-chat
            shard_index: 2
            shard_count: 12
          - label: server-4
            mode: general
            group: general-server-without-chat
            shard_index: 3
            shard_count: 12
          - label: server-5
            mode: general
            group: general-server-without-chat
            shard_index: 4
            shard_count: 12
          - label: server-6
            mode: general
            group: general-server-without-chat
            shard_index: 5
            shard_count: 12
          - label: server-7
            mode: general
            group: general-server-without-chat
            shard_index: 6
            shard_count: 12
          - label: server-8
            mode: general
            group: general-server-without-chat
            shard_index: 7
            shard_count: 12
          - label: server-9
            mode: general
            group: general-server-without-chat
            shard_index: 8
            shard_count: 12
          - label: server-10
            mode: general
            group: general-server-without-chat
            shard_index: 9
            shard_count: 12
          - label: server-11
            mode: general
            group: general-server-without-chat
            shard_index: 10
            shard_count: 12
          - label: server-12
            mode: general
            group: general-server-without-chat
            shard_index: 11
            shard_count: 12
          - label: chat-1
            mode: general
            group: general-chat
            shard_index: 0
            shard_count: 3
          - label: chat-2
            mode: general
            group: general-chat
            shard_index: 1
            shard_count: 3
          - label: chat-3
            mode: general
            group: general-chat
            shard_index: 2
            shard_count: 3
          - label: ui-cli-1
            mode: general
            group: general-workspaces-a
            shard_index: 0
            shard_count: 2
          - label: ui-cli-2
            mode: general
            group: general-workspaces-a
            shard_index: 1
            shard_count: 2
          - label: libraries
            mode: general
            group: general-workspaces-b
          - label: database
            mode: general
            group: general-workspaces-c
          - label: routes-1
            mode: serialized
            shard_index: 0
            shard_count: 8
          - label: routes-2
            mode: serialized
            shard_index: 1
            shard_count: 8
          - label: routes-3
            mode: serialized
            shard_index: 2
            shard_count: 8
          - label: routes-4
            mode: serialized
            shard_index: 3
            shard_count: 8
          - label: routes-5
            mode: serialized
            shard_index: 4
            shard_count: 8
          - label: routes-6
            mode: serialized
            shard_index: 5
            shard_count: 8
          - label: routes-7
            mode: serialized
            shard_index: 6
            shard_count: 8
          - label: routes-8
            mode: serialized
            shard_index: 7
            shard_count: 8
    name: Regression / ${{ matrix.label }}
    env:
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.4
      - name: Install and prepare upstream SDK
        run: |
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Run complete upstream partition
        env:
          MODE: ${{ matrix.mode }}
          GROUP: ${{ matrix.group }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        shell: bash
        run: |
          args=(--mode "$MODE")
          if [ -n "$GROUP" ]; then args+=(--group "$GROUP"); fi
          if [ -n "$SHARD_COUNT" ]; then args+=(--shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT"); fi
          node scripts/run-vitest-stable.mjs "${args[@]}"
  regression:
    name: validate (regression)
    if: always()
    needs: regression_shards
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every regression partition
        env:
          RESULT: ${{ needs.regression_shards.result }}
        run: test "$RESULT" = success
